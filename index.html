<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color" content="#000000">

    <title>Pixel RPG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game-wrapper">

    <canvas id="game" width="320" height="180"></canvas>

    <!-- Кнопки телефона -->
    <div id="mobile-controls">

        <div class="dpad">

            <button class="control up" data-key="up">▲</button>

            <button class="control left" data-key="left">◀</button>

            <button class="control down" data-key="down">▼</button>

            <button class="control right" data-key="right">▶</button>

        </div>

        <div class="action-buttons">
            <button class="action" data-key="interact">A</button>
        </div>

    </div>

    <!-- Подсказка -->
    <div id="fullscreen-hint">
        Нажми на экран для полноэкранного режима
    </div>

</div>

<script src="game.js"></script>

</body>
</html>

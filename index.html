<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Blood Glow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <canvas id="canvas" width="320" height="180"></canvas>

    <!-- Кнопка полноэкранного режима -->
    <button id="fullscreen">⛶</button>

    <!-- МОБИЛЬНОЕ УПРАВЛЕНИЕ -->
    <div id="controls">

        <div id="dpad">

            <button class="control up" data-key="up">▲</button>
            <button class="control left" data-key="left">◀</button>
            <button class="control right" data-key="right">▶</button>
            <button class="control down" data-key="down">▼</button>

        </div>

        <div id="buttons">

            <button class="gameButton z" data-key="z">Z</button>
            <button class="gameButton x" data-key="x">X</button>
            <button class="gameButton c" data-key="c">C</button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

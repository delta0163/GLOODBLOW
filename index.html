<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Blood Glow</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game-wrapper">

    <canvas id="game"
            width="640"
            height="360">
    </canvas>

    <button id="fullscreen-button">⛶</button>

    <!-- ПОСТОЯННЫЙ ИНВЕНТАРЬ -->
    <div id="inventory-hud">
        <div>G <span id="gold">100</span></div>
        <div>🍞 <span id="food">3</span></div>
        <div>♥ <span id="potions">3</span></div>
    </div>

    <!-- JOYSTICK -->
    <div id="joystick">

        <button class="joy up"
                data-key="up">▲</button>

        <button class="joy left"
                data-key="left">◀</button>

        <button class="joy right"
                data-key="right">▶</button>

        <button class="joy down"
                data-key="down">▼</button>

    </div>

    <!-- Z X C -->
    <div id="actions">

        <button class="action-button z-button"
                data-key="z">Z</button>

        <button class="action-button x-button"
                data-key="x">X</button>

        <button class="action-button c-button"
                data-key="c">C</button>

    </div>

    <div id="run-indicator">
        RUN
    </div>

</div>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>Blood Glow RPG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game-wrapper">

    <canvas id="game" width="320" height="180"></canvas>

    <!-- FULLSCREEN -->
    <button id="fullscreen-button">⛶</button>

    <!-- JOYSTICK -->
    <div id="joystick">

        <button class="joy up" data-key="up">▲</button>
        <button class="joy left" data-key="left">◀</button>
        <button class="joy right" data-key="right">▶</button>
        <button class="joy down" data-key="down">▼</button>

    </div>

    <!-- ACTIONS -->
    <div id="actions">

        <button class="action-button z-button" data-key="z">
            Z
        </button>

        <button class="action-button x-button" data-key="x">
            X
        </button>

        <button class="action-button c-button" data-key="c">
            C
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

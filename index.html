<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Blood Glow RPG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">
    <canvas id="canvas" width="320" height="180"></canvas>

    <button id="fullscreen">⛶</button>

    <div id="joystick">
        <button data-key="up" class="up">▲</button>
        <button data-key="left" class="left">◀</button>
        <button data-key="right" class="right">▶</button>
        <button data-key="down" class="down">▼</button>
    </div>

    <div id="buttons">
        <button data-key="z" class="z">Z</button>
        <button data-key="x" class="x">X</button>
        <button data-key="c" class="c">C</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Blood Glow RPG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <canvas id="canvas" width="320" height="180"></canvas>

    <!-- Джойстик -->
    <div id="joystick">
        <button class="joy up" data-key="up">▲</button>
        <button class="joy left" data-key="left">◀</button>
        <button class="joy right" data-key="right">▶</button>
        <button class="joy down" data-key="down">▼</button>
    </div>

    <!-- Кнопки -->
    <div id="buttons">
        <button class="game-btn z" data-key="z">Z</button>
        <button class="game-btn x" data-key="x">X</button>
        <button class="game-btn c" data-key="c">C</button>
    </div>

    <button id="fullscreen">⛶</button>

</div>

<script src="script.js"></script>

</body>
</html>
